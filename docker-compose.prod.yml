services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: carwash-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carwash-network

  # Backend Application (Production)
  app:
    build:
      context: .
      target: production
    container_name: carwash-backend-prod
    restart: always
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      # Persist uploads
      - uploads_data:/app/public/uploads
      # Mount Firebase credentials
      - ./src/config/firebase-service-account.json:/app/src/config/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - carwash-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: carwash-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment below for SSL certificates
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - carwash-network

volumes:
  postgres_data_prod:
  uploads_data:


networks:
  carwash-network:
    driver: bridge
